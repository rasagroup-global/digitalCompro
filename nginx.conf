server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    error_log  /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml
        font/woff2;

    # Cache static assets (Vite hashed bundles, self-hosted fonts, images, video)
    location ~* \.(?:css|js|woff2?|ttf|otf|eot|svg|png|jpe?g|webp|gif|ico|mp4|webm)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }

    # SPA routing fallback (handles /, /about, /contact, /imprint, /de/*)
    location / {
        try_files $uri $uri/ /index.html;
    }
}

